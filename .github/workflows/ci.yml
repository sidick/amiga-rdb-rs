name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Zero dependencies, so there is nothing to vendor and nothing to break.
  CARGO_NET_RETRY: 10

jobs:
  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      # --all-targets skips doctests; run them too, they are part of the docs.
      - run: cargo test --doc

  no-std:
    name: build --no-default-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The crate is no_std + alloc without the `std` feature; this job is the
      # only thing standing between that claim and it quietly becoming false.
      - run: cargo build --no-default-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  msrv:
    # Keep in step with `rust-version` in Cargo.toml; the two are one decision.
    name: msrv (1.63)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.63
      - uses: Swatinem/rust-cache@v2
      # Test + build only. clippy and rustfmt drift lint-for-lint between
      # releases, so pinning their opinions to an old toolchain buys nothing;
      # they run on stable above.
      - run: cargo test
      - run: cargo build --no-default-features

  differential:
    # The oracle suite: build images here, let amitools' `rdbtool` read them,
    # and parse images `rdbtool` wrote. Pinned to 0.8.1 because every default
    # this crate writes — the envec, the RDSK fields, the FSHD patch flags,
    # the LSEG SummedLongs rule — was observed against that exact version, and
    # a differential against a moving oracle tests nothing. amitools is GPL:
    # it is run here, never copied.
    name: differential (amitools 0.8.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # python3 and pip are preinstalled on the runners; --user keeps it out
      # of the system site-packages and needs no virtualenv dance.
      - run: pip install --user amitools==0.8.1
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rdbtool --help > /dev/null
      # The differential tests are `#[test]`s gated on this variable: without
      # it they return immediately, which is why the rest of CI needs no
      # amitools. `rdbtool` filters to just them.
      - run: cargo test rdbtool
        env:
          AMIGA_RDB_DIFFERENTIAL: "1"

  # TODO: the remaining differential is the boot-level one — an AROS `DOS\7`
  # fixture with its filesystem in the RDB, mounted by a 3.1-era ROM, once
  # amibake's `aros68k` recipe can build a redistributable image here. The
  # block-level oracle above covers RDSK/PART/FSHD/LSEG in both directions;
  # what it cannot say is whether a real ROM boots the result. Milestone 3
  # adds AmiPart (MIT) as a second oracle for the mutation path.
