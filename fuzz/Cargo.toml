[package]
name = "amiga-rdb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Its own workspace root, so the fuzz crate never joins the parent's build
# graph: `cargo test`/`cargo clippy` at the repo root neither see nor need
# it (it only builds on nightly, with sanitizer flags).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.amiga-rdb]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
